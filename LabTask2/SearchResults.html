<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zulix Store - Search Results</title>
</head>
<body>

    <header>

        <h1>Zulix Store</h1>

        <form>

            <label for="search">Search Products</label>

            <input
                type="search"
                id="search"
                name="search"
                placeholder="Search products ">

            <button type="submit">Search</button>

        </form>

        <nav>

        <a href="#">Home</a> |
        <a href="#">Smart Watches</a> |
        <a href="#">Accessories</a> |
        <a href="#">Best Sellers</a> |
        <a href="#">Deals</a> |
        <a href="#">Support</a> |
        <a href="#">Account</a> |
        <a href="#">Orders</a> |
        <a href="#">Cart</a>

        </nav>
    </header>
    <nav aria-label="breadcrumb">

    <a href="#">Home</a> >

    <a href="#">Electronics</a> >

    <span>Smart Watches</span>

    </nav>
    <main>

        <aside>

            <h2>Filters</h2>

            <form>

                <fieldset>

                    <legend>Brand</legend>

                    <input type="checkbox" id="zulix" name="brand">
                    <label for="zulix">Zulix</label><br>

                    <input type="checkbox" id="apple" name="brand">
                    <label for="apple">Apple</label><br>

                    <input type="checkbox" id="samsung" name="brand">
                    <label for="samsung">Samsung</label><br>

                    <input type="checkbox" id="sony" name="brand">
                    <label for="sony">Sony</label>

                </fieldset>
                <fieldset>

                    <legend>Customer Rating</legend>

                    <input type="radio" id="five" name="rating">
                    <label for="five">4★ & Above</label><br>

                    <input type="radio" id="four" name="rating">
                    <label for="four">3★ & Above</label>

                </fieldset>
                <fieldset>

                    <legend>Price Range (OMR)</legend>

                    <label for="min-price">Min</label>
                    <input type="number" id="min-price">

                    <br><br>

                    <label for="max-price">Max</label>
                    <input type="number" id="max-price">

                </fieldset>

                <button type="submit">Apply Filters</button>

            </form>

        </aside>
           
    </body>
    </html>
